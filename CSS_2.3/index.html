<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de alta de usuario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Formulario de alta de usuario</h1>

<form method="POST" action="#">
    <table>
        <tr>
            <td colspan="2" class="centrado">
                <label for="id_usuario"><b>Identificador de nuevo usuario</b></label>
                <input type="text" id="id_usuario" name="id_usuario" value="usu_012345" readonly
                       title="Identificador asignado automáticamente. No se puede modificar.">
            </td>
        </tr>
        <tr>
            <td>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" title="Escriba su nombre">
            </td>
            <td>
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" title="Escriba sus apellidos">
            </td>
        </tr>
        <tr>
            <td>
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" title="Escriba una contraseña">
            </td>
            <td>
                <label for="confirmar">Confirmar contraseña:</label>
                <input type="password" id="confirmar" name="confirmar" title="Repita la contraseña escrita">
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <label for="email">Email:</label>
                <input type="text" id="email" name="email" title="Escriba su dirección de correo electrónico">
            </td>
        </tr>
        <tr>
            <td>Sexo:</td>
            <td>
                <input type="radio" id="hombre" name="sexo" value="Hombre">
                <label for="hombre">Hombre</label>
                <input type="radio" id="mujer" name="sexo" value="Mujer" checked>
                <label for="mujer">Mujer</label>
            </td>
        </tr>
        <tr>
            <td>Aficiones:</td>
            <td>
                <input type="checkbox" id="deporte" name="aficiones" value="Deporte">
                <label for="deporte">Deporte</label><br>
                <input type="checkbox" id="lectura" name="aficiones" value="Lectura" checked>
                <label for="lectura">Lectura</label><br>
                <input type="checkbox" id="cine" name="aficiones" value="Cine">
                <label for="cine">Cine</label>
            </td>
        </tr>
        <tr>
            <td>
                <label for="pais">País:</label>
            </td>
            <td>
                <select id="pais" name="pais" title="Seleccione su país">
                    <option value="España" selected>España</option>
                    <option value="Francia">Francia</option>
                    <option value="Portugal">Portugal</option>
                </select>
            </td>
        </tr>
        <tr>
            <td>
                <label for="foto">Subir su foto:</label>
            </td>
            <td>
                <input type="file" id="foto" name="foto" accept="image/*" title="Seleccione una foto de su perfil">
            </td>
        </tr>
        <tr>
            <td>
                <label for="comentarios">Comentarios personales:</label>
            </td>
            <td>
                <textarea id="comentarios" name="comentarios" cols="40" rows="5"
                          placeholder="Escriba aquí sus comentarios"
                          title="Escriba aquí cualquier comentario personal"></textarea>
            </td>
        </tr>
        <tr>
            <td class="centrado">
                <input type="reset" value="Reinicializar" title="Borra los datos y restablece los valores por defecto">
            </td>
            <td class="centrado">
                <input type="submit" value="Enviar" title="Envía el formulario">
            </td>
        </tr>
    </table>
</form>

</body>
</html>
