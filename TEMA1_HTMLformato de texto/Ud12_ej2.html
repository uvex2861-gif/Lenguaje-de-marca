<!DOCTYPE html>

<head>

    <title>UD 1.2 - Ejercicio 2: Formato de texto</title>
</head>
<body>
    <p>Bienvenido a nuestra tienda online.</p>

    <p><strong>Envío gratuito en pedidos superiores a 50 euros.</strong></p>

    <blockquote>
        "La calidad no es un acto, es un hábito" - Aristóteles.
    </blockquote>

    <p>
        Advertencia: el producto ha sido <em>descatalogado</em><br>
        y sustituido por el modelo <mark>XR200</mark>.
    </p>

    <hr>

    <p>
        Precio anterior: <del>39,99 euros</del>.<br>
        Precio actual: <ins>29,99 euros</ins>.
    </p>
</body>
</html>
